
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#f9d9e8"
    >

    <title>Happy Birthday Sejal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="birthday-page">

        <!-- =================================================
             BACKGROUND
             ================================================= -->

        <div class="birthday-background">

            <div class="pink-glow glow-top"></div>
            <div class="pink-glow glow-left"></div>
            <div class="pink-glow glow-right"></div>

            <!-- Floating decorations -->

            <div class="floating-heart heart-one">♡</div>
            <div class="floating-heart heart-two">♡</div>
            <div class="floating-heart heart-three">♥</div>
            <div class="floating-heart heart-four">♡</div>

            <div class="sparkle sparkle-one">✦</div>
            <div class="sparkle sparkle-two">✧</div>
            <div class="sparkle sparkle-three">✦</div>
            <div class="sparkle sparkle-four">✧</div>

            <div class="confetti confetti-one"></div>
            <div class="confetti confetti-two"></div>
            <div class="confetti confetti-three"></div>
            <div class="confetti confetti-four"></div>
            <div class="confetti confetti-five"></div>

        </div>


        <!-- =================================================
             TOP DECORATION
             ================================================= -->

        <div class="top-decoration">

            <span>🎀</span>

            <div class="top-line"></div>

            <span>🎀</span>

        </div>


        <!-- =================================================
             MAIN CARD
             ================================================= -->

        <section class="birthday-card">

            <!-- Small birthday label -->

            <div class="birthday-label">

                <span class="label-line"></span>

                <span>
                    A LITTLE BIRTHDAY SURPRISE
                </span>

                <span class="label-line"></span>

            </div>


            <!-- Birthday balloon -->

            <div class="birthday-balloon">

                <div class="balloon-string"></div>

                <div class="balloon">
                    🎈
                </div>

            </div>


            <!-- Greeting -->

            <div class="welcome-content">

                <p class="hello">
                    HI SEJAL
                </p>

                <h1>
                    Ready for<br>
                    <span>your day?</span>
                </h1>

                <p class="intro-text">
                    There's a little birthday adventure
                    waiting for you.
                </p>


                <!-- Continue -->

                <button
                    id="continueButton"
                    class="continue-button"
                    type="button"
                >

                    <span>
                        Let's go
                    </span>

                    <strong>
                        →
                    </strong>

                </button>

            </div>


            <!-- Bottom birthday decoration -->

            <div class="birthday-footer">

                <span>✨</span>

                <p>
                    made especially for you
                </p>

                <span>✨</span>

            </div>

        </section>


        <!-- =================================================
             BOTTOM DECORATION
             ================================================= -->

        <div class="bottom-decoration">

            <span>♡</span>
            <span>✦</span>
            <span>♡</span>
            <span>✧</span>
            <span>♡</span>

        </div>

    </main>


    <!-- =====================================================
         NAVIGATION
         ===================================================== -->

    <script>

        const continueButton =
            document.getElementById(
                "continueButton"
            );

        continueButton.addEventListener(
            "click",
            function () {

                window.location.href =
                    "bus.html";

            }
        );

    </script>

</body>
</html>
