<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Mangalore &rarr; Manipal</title>

    <link rel="stylesheet" href="bus.css">
</head>

<body>

<div class="game">

    <!-- =========================
         GAME HUD
    ========================== -->

    <div class="hud">

        <div class="coins-box" id="coinsBox">
            <div class="coin-icon">&#10022;</div>

            <div>
                <div class="hud-label">Birthday Coins</div>
                <div class="coin-count" id="coinCount">0</div>
            </div>
        </div>


        <div class="route-box">

            <div class="route-top">
                <span>Mangalore</span>
                <span class="route-arrow">&rarr;</span>
                <span>Manipal</span>
            </div>

            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="route-bottom">
                <span id="timeLeft">70s</span>
                <span>To Manipal</span>
            </div>

        </div>

    </div>


    <!-- =========================
         GAME CANVAS
    ========================== -->

    <canvas id="busCanvas"></canvas>


    <!-- =========================
         STEERING CONTROLS
    ========================== -->

    <div class="controls">

        <button class="steer-button" id="leftButton" aria-label="Move left">&larr;</button>

        <div class="steer-label">Steer</div>

        <button class="steer-button" id="rightButton" aria-label="Move right">&rarr;</button>

    </div>


    <!-- =========================
         START SCREEN
    ========================== -->

    <div class="overlay" id="startScreen">

        <div class="message-card">

            <div class="small-title">Birthday Journey</div>

            <h1>Time to Leave <span>for Manipal!</span></h1>

            <div class="route-chip">
                <span>Mangalore</span>
                <span class="route-arrow">&rarr;</span>
                <span>Manipal</span>
            </div>

            <p style="margin-top: 14px;">
                Collect Birthday Coins<br>
                on your way!
            </p>

            <div class="steer-hint">
                <div class="steer-hint-key">&larr;</div>
                <div class="steer-hint-text">Swipe or<br>tap to steer</div>
                <div class="steer-hint-key">&rarr;</div>
            </div>

            <button class="start-button" id="startButton">Start Journey</button>

        </div>

    </div>


    <!-- =========================
         FINISH SCREEN
    ========================== -->

    <div class="overlay hidden" id="finishScreen">

        <div class="message-card">

            <div class="finish-emoji">&#10024;</div>

            <div class="small-title">Arrived!</div>

            <h1>Welcome to <span>Manipal!</span></h1>

            <p>Sejal made it safely.</p>

            <div class="final-coins">
                <span id="finalCoins">0</span>
                <span>birthday coins collected</span>
            </div>

            <button class="continue-button" id="continueButton">Continue to Basketball</button>

        </div>

    </div>

</div>

<script src="bus.js"></script>

</body>
</html>
